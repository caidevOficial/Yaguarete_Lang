[workspace]
members = [
    "crates/yaguarete_core",
    "crates/yaguarete_cli",
    "crates/yaguarete_installer",
]
default-members = [
    "crates/yaguarete_core",
    "crates/yaguarete_cli",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
