[package]
name = "yaguarete_installer"
version = "0.1.1"
edition = "2021"
authors = ["Facu Falcone <a.facundo.falcone@gmail.com>"]
description = "Instalador Gráfico Todo-en-Uno para YAGUARETÉ en Rust"
license = "GPL-3.0-or-later"

[[bin]]
name = "Instalador_Yaguarete"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
winres = "0.1"
